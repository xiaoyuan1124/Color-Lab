name: Deploy Color Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install test tools
        run: npm install --no-audit --no-fund
      - name: Verify size budget
        run: npm run test:budget
      - name: Verify Color Lab
        run: npm run test:verify
      - name: Visual quality audit
        run: npm run test:visual
      - name: Torture test color engine
        run: npm run test:torture
      - name: Property test color engine
        run: npm run test:property
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser quality and visual regression gate
        run: npm run test:browser
      - name: Upload browser gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-gate
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
