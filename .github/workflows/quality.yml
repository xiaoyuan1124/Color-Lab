name: Color Lab Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: color-lab-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install quality tools
        run: npm install --no-audit --no-fund
      - name: Lighthouse CI
        run: npm run audit:lighthouse
      - name: Summarize Lighthouse
        if: always()
        run: node scripts/lighthouse-summary.mjs
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci-reports
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true


  browser:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install browser quality tools
        run: npm install --no-audit --no-fund
      - name: Verify size budget
        run: npm run test:budget
      - name: Verify Color Lab
        run: npm run test:verify
      - name: Visual quality audit
        run: npm run test:visual
      - name: Torture test color engine
        run: npm run test:torture
      - name: Property test color engine
        run: npm run test:property
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright + axe core gate
        run: npm run test:browser:core
      - name: Upload browser quality artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-quality
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
