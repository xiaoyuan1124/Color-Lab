name: Color Lab iOS Native

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: color-lab-ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Verify Xcode 26
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 26\.'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Native web bundle preflight
        run: npm run test:native
      - name: AppIcon generator self-test
        run: npm run test:app-icon
      - name: Generate iOS project
        run: npm run ios:init
      - name: Verify Color Lab AppIcon
        run: |
          ICON="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          test -f "$ICON"
          test "$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/{print $2}')" = "1024"
          test "$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/{print $2}')" = "1024"
          sips -g hasAlpha "$ICON" | grep -q 'hasAlpha: no'
      - name: Verify native permissions and version
        run: |
          grep -q NSCameraUsageDescription ios/App/App/Info.plist
          grep -q NSPhotoLibraryUsageDescription ios/App/App/Info.plist
          grep -q ITSAppUsesNonExemptEncryption ios/App/App/Info.plist
          grep -q 'MARKETING_VERSION = 1.0.0;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 1;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'TARGETED_DEVICE_FAMILY = 1;' ios/App/App.xcodeproj/project.pbxproj
      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath .native-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify built privacy manifest and local shell
        run: |
          APP_PATH=".native-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          find "$APP_PATH" -name PrivacyInfo.xcprivacy -print | tee .native-privacy-manifests.txt
          test -s .native-privacy-manifests.txt
          test -f "$APP_PATH/public/native-build.json"
          grep -q '"source": "bundled-local-assets"' "$APP_PATH/public/native-build.json"
          if grep -R -E 'server\.url|https://xiaoyuan1124\.github\.io/Color-Lab' "$APP_PATH/public" --include='*.html' --include='*.js' --include='*.json'; then
            echo "Remote app-shell reference detected in native bundle"
            exit 1
          fi
      - name: Install and launch on iOS Simulator
        timeout-minutes: 18
        run: node scripts/ios-simulator-smoke.mjs
      - name: Upload generated native project
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: color-lab-ios-native
          path: |
            ios
            dist/native-build.json
            .native-derived/color-lab-native-launch.png
            .native-launch.txt
          if-no-files-found: error
          retention-days: 7
