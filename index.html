<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F2EDE4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Color Lab" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Color Lab</title>
  <style>
    :root{
      --cream:#F2EDE4;--ink:#292B29;--olive:#68705E;--muted:#8C8278;
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;
    }
    *{box-sizing:border-box} body{margin:0;background:#f6f3ee;color:var(--ink)}
    button,input,select{font:inherit}.app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 28px)}
    header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
    .eyebrow{font-size:11px;letter-spacing:.18em;color:#68705E;font-weight:700}.title{font-size:34px;line-height:1.05;margin:5px 0 0;font-weight:800;letter-spacing:-.04em}
    .card{background:#fff;border:1px solid rgba(41,43,41,.08);border-radius:24px;padding:18px;box-shadow:0 12px 32px rgba(41,43,41,.06);margin-bottom:14px}
    .picker-row{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}.color-input{width:96px;height:96px;border:none;background:none;padding:0;border-radius:22px;overflow:hidden}.hex{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #ded8d0;background:#faf8f5;font-size:19px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.hint{font-size:13px;color:#756f69;margin-top:8px;line-height:1.5}
    .modes{display:flex;gap:8px;overflow:auto;padding:2px 0 4px}.chip{white-space:nowrap;border:1px solid #ddd6cd;background:#fff;border-radius:999px;padding:10px 13px;font-size:13px}.chip.active{background:#292B29;color:#fff;border-color:#292B29}
    .primary{width:100%;border:0;border-radius:16px;padding:15px 18px;background:#292B29;color:#fff;font-weight:800;margin-top:14px}.secondary{border:1px solid #ddd6cd;background:#fff;border-radius:12px;padding:10px 12px;font-weight:700}.ghost{border:0;background:transparent;padding:8px;color:#6a655f;font-weight:700}
    .palette{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.swatch{min-height:164px;border-radius:20px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.role{font-size:11px;letter-spacing:.12em;font-weight:800}.hex-mini{font-size:15px;font-weight:800}.pct{font-size:31px;font-weight:900;letter-spacing:-.04em}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:100px}
    .preview{display:grid;grid-template-columns:75fr 18fr 7fr;height:190px;border-radius:20px;overflow:hidden;border:1px solid rgba(41,43,41,.08)}.preview>div{position:relative}.preview span{position:absolute;bottom:10px;left:10px;font-size:11px;font-weight:800;letter-spacing:.08em}
    .section-title{font-size:15px;font-weight:800;margin:0 0 12px}.sub{font-size:12px;color:#77706a;margin:-4px 0 12px}
    .ideas{display:grid;grid-template-columns:1fr 1fr;gap:10px}.idea{border:1px solid #e3ddd6;border-radius:16px;padding:12px;background:#fff;text-align:left}.idea-top{display:flex;height:52px;border-radius:12px;overflow:hidden;margin-bottom:9px}.idea-top i{flex:1}.idea-name{font-weight:800;font-size:13px}.idea-meta{font-size:11px;color:#77706a;margin-top:3px}
    .saved-empty{font-size:13px;color:#7c756e}.saved-list{display:grid;gap:9px}.saved-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#faf8f5}.mini3{display:flex;width:88px;height:38px;border-radius:10px;overflow:hidden}.mini3 i:nth-child(1){flex:75}.mini3 i:nth-child(2){flex:18}.mini3 i:nth-child(3){flex:7}.saved-copy{margin-left:auto}
    .foot{font-size:11px;line-height:1.6;color:#8a837c;text-align:center;margin-top:18px}
  </style>
</head>
<body>
<div class="app">
  <header><div><div class="eyebrow">PERSONAL COLOR LAB</div><div class="title">從一個顏色<br>找到整個方向。</div></div></header>

  <section class="card">
    <div class="picker-row">
      <input id="color" class="color-input" type="color" value="#68705E" aria-label="選擇起始顏色">
      <div><input id="hex" class="hex" value="#68705E" maxlength="7" aria-label="HEX 顏色"><div class="hint">先選一個你今天想到的顏色。照片取色只是入口之一，不是主角。</div></div>
    </div>
    <div class="modes" id="modes" style="margin-top:14px"></div>
    <button class="primary" id="generate">延伸這個顏色</button>
  </section>

  <section class="card">
    <h2 class="section-title">75 / 18 / 7</h2>
    <div class="sub">Base = 空間　Structure = 結構　Accent = 注意力</div>
    <div class="palette" id="palette"></div>
    <div class="actions">
      <button class="secondary" data-shuffle="base">換 Base</button>
      <button class="secondary" data-shuffle="structure">換 Structure</button>
      <button class="secondary" data-shuffle="accent">換 Accent</button>
    </div>
    <button class="primary" id="save">♡ 收藏這組</button>
  </section>

  <section class="card">
    <h2 class="section-title">實際比例</h2>
    <div class="preview" id="preview"></div>
  </section>

  <section class="card">
    <h2 class="section-title">其他方向</h2>
    <div class="sub">同一個起始色，可以往不同氣氛走。</div>
    <div class="ideas" id="ideas"></div>
  </section>

  <section class="card">
    <h2 class="section-title">我的收藏</h2>
    <div id="saved"></div>
  </section>

  <div class="foot">Color Lab V0.1 · 建議的是「可能成立的關係」，不是唯一正確答案。<br>長按／點擊色碼可複製。</div>
</div>
<script>
const MODES = {
  quiet:{label:'安靜', baseL:.93, structureL:.27, accentShift:22, sat:.26},
  warm:{label:'溫暖', baseL:.92, structureShift:-18, accentShift:32, sat:.36},
  cool:{label:'冷調', baseL:.95, structureShift:24, accentShift:-34, sat:.30},
  luxe:{label:'精品', baseL:.94, structureL:.18, accentShift:150, sat:.38},
  natural:{label:'自然', baseL:.91, structureShift:-8, accentShift:38, sat:.28},
  bold:{label:'大膽', baseL:.96, structureL:.16, accentShift:180, sat:.62}
};
let mode='quiet';
let seed='#68705E';
let palette={base:'#F2EDE4',structure:'#292B29',accent:'#68705E'};

const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function clamp(v,a=0,b=1){return Math.min(b,Math.max(a,v))}
function hexToRgb(hex){hex=hex.replace('#',''); if(hex.length===3)hex=hex.split('').map(x=>x+x).join(''); return [0,2,4].map(i=>parseInt(hex.slice(i,i+2),16)/255)}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(clamp(v)*255).toString(16).padStart(2,'0')).join('').toUpperCase()}
function rgbToHsl(r,g,b){let mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0,s=0,l=(mx+mn)/2;if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=60*(((g-b)/d)%6);else if(mx===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}if(h<0)h+=360;return[h,s,l]}
function hslToRgb(h,s,l){h=((h%360)+360)%360;let c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return[r+m,g+m,b+m]}
function hslHex(h,s,l){return rgbToHex(...hslToRgb(h,clamp(s),clamp(l)))}
function lum(hex){const c=hexToRgb(hex).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function textFor(bg){return lum(bg)>.48?'#292B29':'#F8F6F0'}
function normHex(v){v=v.trim();if(!v.startsWith('#'))v='#'+v;return /^#[0-9a-fA-F]{6}$/.test(v)?v.toUpperCase():null}
function derive(seed, style=mode){const [h,s,l]=rgbToHsl(...hexToRgb(seed));const m=MODES[style];
  let baseH=h, baseS=Math.min(.14,Math.max(.04,s*.22)), baseL=m.baseL;
  if(style==='warm') baseH=h-10; if(style==='cool') baseH=h+8;
  let structureH=h+(m.structureShift??0), structureS=Math.min(.34,Math.max(.08,s*.48)), structureL=m.structureL??(.24 + (l>.62?-.04:.04));
  let accentH=h+m.accentShift, accentS=Math.min(.78,Math.max(m.sat,s*.78)), accentL= style==='bold'?.52 : .48;
  if(style==='natural'){structureH=h-24; accentH=h+42; structureS=.20; accentS=.38}
  return {base:hslHex(baseH,baseS,baseL),structure:hslHex(structureH,structureS,structureL),accent:hslHex(accentH,accentS,accentL)}
}
function scorePair(a,b,role){const [ha,sa,la]=rgbToHsl(...hexToRgb(a)),[hb,sb,lb]=rgbToHsl(...hexToRgb(b));let dh=Math.abs(ha-hb);dh=Math.min(dh,360-dh);let score=0;if(role==='structure'){score+=Math.abs(lum(a)-lum(b))*2.2;score+=dh>20&&dh<80?.25:0;score+=sb<.5?.2:0}else{score+=(dh>25&&dh<75?.45:0)+(dh>140?.35:0);score+=sb>.25?.25:0;score+=Math.abs(lum(a)-lum(b))*.7}return score}
function alternatives(role){const [h,s,l]=rgbToHsl(...hexToRgb(seed));const shifts=role==='accent'?[25,-25,45,-45,150,-150,180,90,-90]:[0,20,-20,35,-35,160];let arr=shifts.map((sh,i)=>{let hh=h+sh, ss=role==='accent'?Math.max(.28,Math.min(.72,s*.85+.08)):Math.max(.10,Math.min(.38,s*.45)), ll=role==='accent'?[.46,.52,.42,.55][i%4]:[.18,.24,.3,.34][i%4];let hex=hslHex(hh,ss,ll);return {hex,score:scorePair(seed,hex,role)}}).sort((a,b)=>b.score-a.score);return arr.map(x=>x.hex)}
function generate(){palette=derive(seed,mode);render()}
function shuffle(role){if(role==='base'){const [h,s]=rgbToHsl(...hexToRgb(seed)); const opts=[.89,.92,.95,.97]; palette.base=hslHex(h,Math.min(.16,s*.22),opts[Math.floor(Math.random()*opts.length)])} else {palette[role]=alternatives(role)[Math.floor(Math.random()*5)]} render()}
function render(){
  const p=$('#palette');p.innerHTML='';[['base','BASE',75],['structure','STRUCTURE',18],['accent','ACCENT',7]].forEach(([k,label,pct])=>{const sw=document.createElement('div');sw.className='swatch';sw.style.background=palette[k];sw.style.color=textFor(palette[k]);sw.innerHTML=`<div><div class="role">${label}</div><div class="pct">${pct}</div></div><button class="ghost hex-mini" style="color:inherit" data-copy="${palette[k]}">${palette[k]}</button>`;p.appendChild(sw)});
  const pv=$('#preview');pv.innerHTML='';[['base','75%'],['structure','18%'],['accent','7%']].forEach(([k,t])=>{let d=document.createElement('div');d.style.background=palette[k];d.style.color=textFor(palette[k]);d.innerHTML=`<span>${t}</span>`;pv.appendChild(d)});
  renderIdeas();renderSaved();
}
function renderIdeas(){const box=$('#ideas');box.innerHTML='';Object.entries(MODES).forEach(([key,m])=>{const p=derive(seed,key);const btn=document.createElement('button');btn.className='idea';btn.innerHTML=`<div class="idea-top"><i style="background:${p.base}"></i><i style="background:${p.structure}"></i><i style="background:${p.accent}"></i></div><div class="idea-name">${m.label}</div><div class="idea-meta">${p.base} · ${p.structure} · ${p.accent}</div>`;btn.onclick=()=>{mode=key;palette=p;renderModes();render();window.scrollTo({top:300,behavior:'smooth'})};box.appendChild(btn)})}
function renderModes(){const el=$('#modes');el.innerHTML='';Object.entries(MODES).forEach(([k,m])=>{const b=document.createElement('button');b.className='chip'+(k===mode?' active':'');b.textContent=m.label;b.onclick=()=>{mode=k;renderModes();generate()};el.appendChild(b)})}
function save(){const data=JSON.parse(localStorage.getItem('colorlab.saved')||'[]');data.unshift({seed,mode,palette,date:Date.now()});localStorage.setItem('colorlab.saved',JSON.stringify(data.slice(0,30)));renderSaved()}
function renderSaved(){const el=$('#saved');const data=JSON.parse(localStorage.getItem('colorlab.saved')||'[]');if(!data.length){el.innerHTML='<div class="saved-empty">還沒有收藏。看到真的想再用的組合再存。</div>';return}el.innerHTML='<div class="saved-list"></div>';const list=el.firstChild;data.forEach((x,i)=>{const d=document.createElement('div');d.className='saved-item';d.innerHTML=`<div class="mini3"><i style="background:${x.palette.base}"></i><i style="background:${x.palette.structure}"></i><i style="background:${x.palette.accent}"></i></div><div><b>${MODES[x.mode]?.label||x.mode}</b><div class="idea-meta">${x.seed}</div></div><button class="ghost saved-copy" data-load="${i}">套用</button>`;list.appendChild(d)})}
function copy(v){navigator.clipboard?.writeText(v).catch(()=>{});}
$('#color').addEventListener('input',e=>{seed=e.target.value.toUpperCase();$('#hex').value=seed;generate()});
$('#hex').addEventListener('change',e=>{const h=normHex(e.target.value);if(h){seed=h;$('#color').value=h;$('#hex').value=h;generate()}else e.target.value=seed});
$('#generate').onclick=generate;$('#save').onclick=save;
$$('[data-shuffle]').forEach(b=>b.onclick=()=>shuffle(b.dataset.shuffle));
document.addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(c)copy(c.dataset.copy);const l=e.target.closest('[data-load]');if(l){const data=JSON.parse(localStorage.getItem('colorlab.saved')||'[]');const x=data[+l.dataset.load];if(x){seed=x.seed;mode=x.mode;palette=x.palette;$('#color').value=seed;$('#hex').value=seed;renderModes();render()}}});
renderModes();generate();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
