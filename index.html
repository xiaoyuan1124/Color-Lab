<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EFE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Color Lab">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Color Lab</title>
<style>
:root{
  --bg:#F3EFE8;--paper:#FAF8F4;--ink:#242624;--muted:#77736D;
  --line:#DCD6CE;--olive:#68705E;--white:#FFFDF9;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 44px)}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:54px}
.brand{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--olive)}
.version{font-size:11px;color:#9A958E}
.hero{margin-bottom:56px}
.hero h1{font-size:43px;line-height:1.08;letter-spacing:-.045em;margin:0 0 18px;font-weight:700}
.hero p{font-size:16px;line-height:1.75;color:var(--muted);margin:0;max-width:390px}
.seed-block{margin-bottom:60px}
.seed-stage{display:flex;align-items:center;gap:24px;margin-bottom:26px}
.color-shell{width:128px;height:128px;border-radius:50%;padding:0;border:0;background:transparent;box-shadow:0 0 0 1px rgba(36,38,36,.06),0 18px 40px rgba(36,38,36,.08)}
.color-input{width:128px;height:128px;border:0;padding:0;border-radius:50%;overflow:hidden;background:none}
.color-input::-webkit-color-swatch-wrapper{padding:0}
.color-input::-webkit-color-swatch{border:0;border-radius:50%}
.seed-meta{flex:1;min-width:0}
.seed-kicker{font-size:12px;color:var(--muted);margin-bottom:8px}
.hex{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 0 10px;font-size:28px;font-weight:600;letter-spacing:.02em;color:var(--ink);text-transform:uppercase;outline:none}
.seed-note{font-size:13px;color:#8A857E;line-height:1.6;margin-top:10px}
.combo-head{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 12px}
.combo-title{font-size:12px;color:var(--muted)}
.combo-count{font-size:11px;color:#9A958E}
.combo-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.slot-wrap{position:relative}
.combo-slot{width:100%;height:86px;border:1px solid var(--line);border-radius:17px;background:transparent;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:.18s ease;overflow:hidden}
.combo-slot.active{box-shadow:0 0 0 2px var(--ink);border-color:transparent}
.combo-slot.empty{border-style:dashed;align-items:center;justify-content:center;color:#8F8982;font-size:24px}
.slot-no{font-size:10px;letter-spacing:.1em;font-weight:700;opacity:.7}
.slot-hex{font-size:12px;font-weight:650;letter-spacing:.01em}
.slot-remove{position:absolute;right:7px;top:7px;width:24px;height:24px;border:0;border-radius:12px;background:rgba(20,20,20,.28);color:#fff;line-height:24px;padding:0;text-align:center;font-size:15px;z-index:2}
.source-actions{display:flex;align-items:center;gap:12px;margin:-4px 0 26px}
.photo-trigger{border:0;background:transparent;color:var(--olive);padding:0;font-size:14px;font-weight:600}
.photo-trigger::before{content:"＋";margin-right:7px;font-size:16px;font-weight:400}
.photo-panel{display:none;margin:0 0 28px}
.photo-panel.show{display:block}
.photo-frame{position:relative;border-radius:20px;overflow:hidden;background:#DED9D1;line-height:0;touch-action:manipulation}
.photo-frame canvas{display:block;width:100%;height:auto;background:#DED9D1}
.pick-marker{position:absolute;width:28px;height:28px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.22);transform:translate(-50%,-50%);pointer-events:none;display:none}
.pick-marker::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--picked,#68705E)}
.magnifier{position:absolute;width:112px;height:112px;border-radius:56px;border:4px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.28);overflow:hidden;pointer-events:none;display:none;background:#111;z-index:4}
.magnifier canvas{width:112px!important;height:112px!important;image-rendering:pixelated;background:#111}
.magnifier::before,.magnifier::after{content:"";position:absolute;z-index:5;background:rgba(255,255,255,.95)}
.magnifier::before{left:54px;top:0;width:2px;height:112px}
.magnifier::after{top:54px;left:0;height:2px;width:112px}
.pick-readout{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;background:rgba(20,20,20,.78);color:#fff;font-size:10px;line-height:1;padding:6px 8px;border-radius:999px;letter-spacing:.04em;white-space:nowrap}
.photo-caption{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:12px;line-height:1.4}
.photo-hint{font-size:12px;color:var(--muted)}
.photo-change{border:0;background:transparent;padding:0;color:var(--ink);font-size:12px;font-weight:600}
.modes{display:flex;gap:8px;overflow-x:auto;padding:1px 0 2px;scrollbar-width:none;margin:0 -2px 22px}
.modes::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:#625E58;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:500}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.primary{width:100%;border:0;background:var(--ink);color:#fff;border-radius:15px;padding:16px 18px;font-size:15px;font-weight:600;letter-spacing:.01em}
.primary .arrow{float:right;font-size:18px;font-weight:400}
.section{padding-top:48px;border-top:1px solid var(--line);margin-top:48px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--olive);font-weight:700;margin-bottom:7px}
.section h2{font-size:27px;line-height:1.18;letter-spacing:-.03em;margin:0;font-weight:650}
.section-desc{font-size:13px;line-height:1.6;color:var(--muted);margin-top:8px}
.mode-label{font-size:12px;color:var(--muted);padding-bottom:4px}
.preview{height:244px;display:grid;grid-template-columns:75fr 18fr 7fr;border-radius:22px;overflow:hidden;background:#ddd;margin-bottom:24px}
.preview>div{position:relative}
.preview span{position:absolute;left:13px;bottom:13px;font-size:10px;letter-spacing:.08em;font-weight:700}
.relation-list{display:grid;gap:0}
.relation{display:grid;grid-template-columns:1fr auto;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.relation:last-child{border-bottom:0}
.relation-main{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:14px}
.dot{width:52px;height:52px;border-radius:15px;border:1px solid rgba(36,38,36,.07)}
.role{font-size:11px;letter-spacing:.13em;font-weight:700;color:#817C75;margin-bottom:5px}
.role-line{display:flex;align-items:baseline;gap:10px}
.pct{font-size:23px;font-weight:650;letter-spacing:-.03em}
.hex-mini{border:0;background:transparent;color:var(--muted);padding:0;font-size:13px;font-weight:500}
.shuffle{border:0;background:transparent;color:#6E6963;font-size:13px;padding:10px 0 10px 14px}
.name-field{margin-top:22px}
.name-label{font-size:11px;letter-spacing:.12em;color:#817C75;font-weight:700;margin-bottom:8px}
.name-input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 0 11px;font-size:18px;font-weight:600;color:var(--ink);outline:none}
.name-input::placeholder{color:#A59F97;font-weight:400}
.save{margin-top:16px;width:100%;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600}
.ideas-wrap{overflow:hidden;margin:0 -24px}
.ideas{display:flex;gap:14px;overflow-x:auto;padding:2px 24px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.ideas::-webkit-scrollbar{display:none}
.idea{scroll-snap-align:start;flex:0 0 78%;max-width:320px;border:0;background:transparent;padding:0;text-align:left}
.idea-top{display:grid;grid-template-columns:75fr 18fr 7fr;height:168px;border-radius:20px;overflow:hidden;margin-bottom:14px}
.idea-name{font-size:17px;font-weight:600;letter-spacing:-.01em}
.idea-meta{font-size:11px;color:#8B867F;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-empty{font-size:14px;line-height:1.7;color:var(--muted);padding:4px 0 2px}
.saved-list{display:grid}
.saved-item{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.saved-item:last-child{border-bottom:0}
.mini3{display:grid;grid-template-columns:75fr 18fr 7fr;width:86px;height:48px;border-radius:13px;overflow:hidden;flex:none}
.saved-info{min-width:0}
.saved-info{flex:1;min-width:0}
.saved-info b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.saved-rename,.saved-copy{border:0;background:transparent;color:var(--olive);font-size:13px;font-weight:600;padding:10px 0}
.saved-rename{color:#7E7871}
.footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--line);font-size:11px;line-height:1.7;color:#969089}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);background:#202220;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.22s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:390px){
  .app{padding-left:20px;padding-right:20px}
  .hero h1{font-size:39px}
  .seed-stage{gap:18px}
  .color-shell,.color-input{width:112px;height:112px}
  .ideas-wrap{margin-left:-20px;margin-right:-20px}
  .ideas{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topline"><div class="brand">PERSONAL COLOR LAB</div><div class="version">V0.4.1</div></div>

  <header class="hero">
    <h1>從顏色開始</h1>
    <p>選 1 至 3 個顏色 系統補滿三色</p>
  </header>

  <section class="seed-block">
    <div class="seed-stage">
      <div class="color-shell"><input id="color" class="color-input" type="color" value="#68705E" aria-label="選擇起始顏色"></div>
      <div class="seed-meta">
        <div class="seed-kicker">目前編輯</div>
        <input id="hex" class="hex" value="#68705E" maxlength="7" aria-label="HEX 顏色">
        <div class="seed-note">選色槽後可用色盤 HEX 或照片取色</div>
      </div>
    </div>
    <div class="combo-head">
      <div class="combo-title">你的三色組合</div>
      <div class="combo-count" id="comboCount">1 / 3</div>
    </div>
    <div class="combo-slots" id="comboSlots"></div>
    <div class="source-actions">
      <button class="photo-trigger" id="photoTrigger" type="button">從照片取色</button>
      <input id="photoInput" type="file" accept="image/*" hidden>
    </div>
    <div class="photo-panel" id="photoPanel">
      <div class="photo-frame" id="photoFrame">
        <canvas id="photoCanvas" aria-label="點照片選取顏色"></canvas>
        <div class="pick-marker" id="pickMarker"></div>
        <div class="magnifier" id="magnifier">
          <canvas id="magnifierCanvas" width="112" height="112"></canvas>
          <div class="pick-readout" id="pickReadout">#68705E</div>
        </div>
      </div>
      <div class="photo-caption">
        <div class="photo-hint">按住拖動 精準取色</div>
        <button class="photo-change" id="photoChange" type="button">更換照片</button>
      </div>
    </div>
    <div class="modes" id="modes"></div>
    <button class="primary" id="generate">完成三色組合 <span class="arrow">→</span></button>
  </section>

  <section class="section" id="result">
    <div class="section-head">
      <div>
        <div class="eyebrow">75 / 18 / 7</div>
        <h2>這組顏色的關係</h2>
        <div class="section-desc">系統只安排角色 不改動你已選的顏色</div>
      </div>
      <div class="mode-label" id="modeLabel"></div>
    </div>

    <div class="preview" id="preview"></div>
    <div class="relation-list" id="palette"></div>
    <div class="name-field">
      <div class="name-label">配色名稱</div>
      <input id="comboName" class="name-input" maxlength="24" placeholder="例如 秋日下午">
    </div>
    <button class="save" id="save">♡ 收藏這組配色</button>
  </section>

  <section class="section">
    <div class="section-head">
      <div>
        <div class="eyebrow">VARIATIONS</div>
        <h2>同一個顏色，<br>可以往不同氣氛走。</h2>
      </div>
    </div>
    <div class="ideas-wrap"><div class="ideas" id="ideas"></div></div>
  </section>

  <section class="section">
    <div class="section-head">
      <div>
        <div class="eyebrow">LIBRARY</div>
        <h2>我的收藏</h2>
        <div class="section-desc">只留下你真的想再用一次的組合。</div>
      </div>
    </div>
    <div id="saved"></div>
  </section>

  <div class="footer">Color Lab V0.4.1<br>美，不是把漂亮的東西放在一起。美，是讓它們之間的關係成立。</div>
</div>
<div id="toast" class="toast">已複製</div>

<script>
const MODES={
  quiet:{label:'安靜',baseL:.93,structureL:.27,accentShift:22,sat:.26},
  warm:{label:'溫暖',baseL:.92,structureShift:-18,accentShift:32,sat:.36},
  cool:{label:'冷調',baseL:.95,structureShift:24,accentShift:-34,sat:.30},
  luxe:{label:'精品',baseL:.94,structureL:.18,accentShift:150,sat:.38},
  natural:{label:'自然',baseL:.91,structureShift:-8,accentShift:38,sat:.28},
  bold:{label:'大膽',baseL:.96,structureL:.16,accentShift:180,sat:.62}
};
let mode='quiet',seed='#68705E',palette={base:'#F2EDE4',structure:'#292B29',accent:'#68705E'};
let selectedColors=['#68705E',null,null],activeSlot=0,currentComboName='';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function clamp(v,a=0,b=1){return Math.min(b,Math.max(a,v))}
function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(x=>x+x).join('');return[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16)/255)}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(clamp(v)*255).toString(16).padStart(2,'0')).join('').toUpperCase()}
function rgbToHsl(r,g,b){let mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0,s=0,l=(mx+mn)/2;if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=60*(((g-b)/d)%6);else if(mx===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}if(h<0)h+=360;return[h,s,l]}
function hslToRgb(h,s,l){h=((h%360)+360)%360;let c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return[r+m,g+m,b+m]}
function hslHex(h,s,l){return rgbToHex(...hslToRgb(h,clamp(s),clamp(l)))}
function lum(hex){const c=hexToRgb(hex).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return.2126*c[0]+.7152*c[1]+.0722*c[2]}
function textFor(bg){return lum(bg)>.48?'#242624':'#FFFDF9'}
function normHex(v){v=v.trim();if(!v.startsWith('#'))v='#'+v;return/^#[0-9a-fA-F]{6}$/.test(v)?v.toUpperCase():null}
function chosenColors(){return selectedColors.filter(Boolean)}
function hueDistance(a,b){let d=Math.abs(a-b)%360;return Math.min(d,360-d)}
function stats(hex){const [h,s,l]=rgbToHsl(...hexToRgb(hex));return{hex,h,s,l,y:lum(hex)}}
function permutations3(a){
  return [
    [a[0],a[1],a[2]],[a[0],a[2],a[1]],[a[1],a[0],a[2]],
    [a[1],a[2],a[0]],[a[2],a[0],a[1]],[a[2],a[1],a[0]]
  ];
}
function assignmentScore(arr){
  const b=stats(arr[0]),s=stats(arr[1]),a=stats(arr[2]);
  let score=0;
  score += 2.8*(1-Math.min(1,Math.abs(b.y-.90)/.9));
  score += .8*(1-b.s);
  score += 2.0*(1-Math.min(1,Math.abs(s.y-.30)/.7));
  score += 1.4*Math.abs(b.y-s.y);
  score += 1.15*a.s;
  score += .7*(hueDistance(a.h,b.h)/180);
  score += .5*Math.abs(a.y-b.y);
  return score;
}
function bestRoleAssignment(colors){
  let best=null,bestScore=-Infinity;
  for(const p of permutations3(colors)){
    const sc=assignmentScore(p);
    if(sc>bestScore){bestScore=sc;best=p}
  }
  return {base:best[0],structure:best[1],accent:best[2]};
}
function candidateColors(inputs,style=mode){
  const m=MODES[style],out=[];
  for(const hex of inputs){
    const {h,s,l}=stats(hex);
    out.push(
      hslHex(h,Math.min(.14,Math.max(.04,s*.22)),m.baseL??.94),
      hslHex(h+(m.structureShift??0),Math.min(.34,Math.max(.08,s*.48)),m.structureL??.25),
      hslHex(h+m.accentShift,Math.min(.78,Math.max(m.sat,s*.8)),style==='bold'?.52:.48),
      hslHex(h+180,Math.min(.72,Math.max(.32,s*.8)),.49),
      hslHex(h+150,Math.min(.62,Math.max(.28,s*.72)),.50),
      hslHex(h-150,Math.min(.62,Math.max(.28,s*.72)),.50),
      hslHex(h+35,Math.min(.50,Math.max(.20,s*.65)),.48)
    );
  }
  return [...new Set(out.map(x=>x.toUpperCase()))].filter(x=>!inputs.includes(x));
}
function completeCombo(inputs,style=mode){
  const chosen=[...new Set(inputs.map(x=>x.toUpperCase()))].slice(0,3);
  if(chosen.length===3)return bestRoleAssignment(chosen);

  const pool=candidateColors(chosen,style);
  let best=null,bestScore=-Infinity;

  if(chosen.length===2){
    for(const x of pool){
      const trio=[chosen[0],chosen[1],x];
      const pal=bestRoleAssignment(trio);
      const sc=assignmentScore([pal.base,pal.structure,pal.accent]);
      if(sc>bestScore){bestScore=sc;best=pal}
    }
  }else{
    for(let i=0;i<pool.length;i++){
      for(let j=i+1;j<pool.length;j++){
        const trio=[chosen[0],pool[i],pool[j]];
        const pal=bestRoleAssignment(trio);
        const sc=assignmentScore([pal.base,pal.structure,pal.accent]);
        if(sc>bestScore){bestScore=sc;best=pal}
      }
    }
  }
  return best||derive(chosen[0],style);
}
function syncEditor(){
  const current=selectedColors[activeSlot]||seed;
  seed=current;
  $('#color').value=current;
  $('#hex').value=current;
  renderComboSlots();
}
function setColorAtActive(hex){
  const h=normHex(hex);
  if(!h)return;
  selectedColors[activeSlot]=h;
  seed=h;
  $('#color').value=h;
  $('#hex').value=h;
  generate(false);
  renderComboSlots();
}
function setActiveSlot(i,openPicker=false){
  activeSlot=i;
  if(selectedColors[i]){
    seed=selectedColors[i];
    $('#color').value=seed;
    $('#hex').value=seed;
  }
  renderComboSlots();
  if(openPicker&&!selectedColors[i])setTimeout(()=>$('#color').click(),0);
}
function removeSlot(i){
  if(chosenColors().length<=1){toast('至少保留一個顏色');return}
  selectedColors[i]=null;
  if(activeSlot===i){
    activeSlot=selectedColors.findIndex(Boolean);
    if(activeSlot<0)activeSlot=0;
  }
  syncEditor();
  generate(false);
}
function renderComboSlots(){
  const box=$('#comboSlots'); if(!box)return;
  box.innerHTML='';
  $('#comboCount').textContent=chosenColors().length+' / 3';
  selectedColors.forEach((hex,i)=>{
    const wrap=document.createElement('div');wrap.className='slot-wrap';
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='combo-slot '+(hex?'':'empty')+(i===activeSlot?' active':'');
    btn.dataset.slot=i;
    if(hex){
      btn.style.background=hex;
      btn.style.color=textFor(hex);
      btn.innerHTML='<span class="slot-no">COLOR '+(i+1)+'</span><span class="slot-hex">'+hex+'</span>';
      if(chosenColors().length>1){
        const rm=document.createElement('button');rm.type='button';rm.className='slot-remove';rm.dataset.removeSlot=i;rm.textContent='×';wrap.appendChild(rm);
      }
    }else{
      btn.innerHTML='<span>＋</span><span class="slot-no">ADD COLOR</span>';
    }
    wrap.insertBefore(btn,wrap.firstChild);
    box.appendChild(wrap);
  });
}

function derive(seed,style=mode){const[h,s,l]=rgbToHsl(...hexToRgb(seed)),m=MODES[style];let baseH=h,baseS=Math.min(.14,Math.max(.04,s*.22)),baseL=m.baseL;if(style==='warm')baseH=h-10;if(style==='cool')baseH=h+8;let structureH=h+(m.structureShift??0),structureS=Math.min(.34,Math.max(.08,s*.48)),structureL=m.structureL??(.24+(l>.62?-.04:.04));let accentH=h+m.accentShift,accentS=Math.min(.78,Math.max(m.sat,s*.78)),accentL=style==='bold'?.52:.48;if(style==='natural'){structureH=h-24;accentH=h+42;structureS=.20;accentS=.38}return{base:hslHex(baseH,baseS,baseL),structure:hslHex(structureH,structureS,structureL),accent:hslHex(accentH,accentS,accentL)}}
function scorePair(a,b,role){const[ha,sa,la]=rgbToHsl(...hexToRgb(a)),[hb,sb,lb]=rgbToHsl(...hexToRgb(b));let dh=Math.abs(ha-hb);dh=Math.min(dh,360-dh);let score=0;if(role==='structure'){score+=Math.abs(lum(a)-lum(b))*2.2;score+=dh>20&&dh<80?.25:0;score+=sb<.5?.2:0}else{score+=(dh>25&&dh<75?.45:0)+(dh>140?.35:0);score+=sb>.25?.25:0;score+=Math.abs(lum(a)-lum(b))*.7}return score}
function alternatives(role){const[h,s,l]=rgbToHsl(...hexToRgb(seed)),shifts=role==='accent'?[25,-25,45,-45,150,-150,180,90,-90]:[0,20,-20,35,-35,160];return shifts.map((sh,i)=>{let hh=h+sh,ss=role==='accent'?Math.max(.28,Math.min(.72,s*.85+.08)):Math.max(.10,Math.min(.38,s*.45)),ll=role==='accent'?[.46,.52,.42,.55][i%4]:[.18,.24,.3,.34][i%4],hex=hslHex(hh,ss,ll);return{hex,score:scorePair(seed,hex,role)}}).sort((a,b)=>b.score-a.score).map(x=>x.hex)}
function generate(scroll=false){palette=completeCombo(chosenColors(),mode);renderComboSlots();render();if(scroll)$('#result').scrollIntoView({behavior:'smooth',block:'start'})}
function shuffle(role){if(role==='base'){const[h,s]=rgbToHsl(...hexToRgb(seed)),opts=[.89,.92,.95,.97];palette.base=hslHex(h,Math.min(.16,s*.22),opts[Math.floor(Math.random()*opts.length)])}else{const opts=alternatives(role);palette[role]=opts[Math.floor(Math.random()*Math.min(5,opts.length))]}render()}
function render(){
  $('#modeLabel').textContent=MODES[mode].label;
  const p=$('#palette');p.innerHTML='';
  const selectedSet=new Set(chosenColors());
  [['base','BASE','Calm',75],['structure','STRUCTURE','Order',18],['accent','ACCENT','Focus',7]].forEach(([k,label,meaning,pct])=>{
    const row=document.createElement('div');row.className='relation';
    const isOwn=selectedSet.has(palette[k]);
    row.innerHTML=`<div class="relation-main"><div class="dot" style="background:${palette[k]}"></div><div><div class="role">${label} · ${meaning} · ${isOwn?'自選':'推薦'}</div><div class="role-line"><span class="pct">${pct}%</span><button class="hex-mini" data-copy="${palette[k]}">${palette[k]}</button></div></div></div>${isOwn?'':'<button class="shuffle" data-shuffle="'+k+'">換一個</button>'}`;
    p.appendChild(row);
  });
  const pv=$('#preview');pv.innerHTML='';
  [['base','75'],['structure','18'],['accent','7']].forEach(([k,t])=>{const d=document.createElement('div');d.style.background=palette[k];d.style.color=textFor(palette[k]);d.innerHTML=`<span>${t}</span>`;pv.appendChild(d)});
  renderIdeas();renderSaved();
}
function renderIdeas(){const box=$('#ideas');box.innerHTML='';
  if(chosenColors().length===3){
    const p=completeCombo(chosenColors(),mode),btn=document.createElement('button');btn.className='idea';
    btn.innerHTML=`<div class="idea-top"><i style="background:${p.base}"></i><i style="background:${p.structure}"></i><i style="background:${p.accent}"></i></div><div class="idea-name">你的三色 combo</div><div class="idea-meta">三色完整 系統不改動</div>`;box.appendChild(btn);return;
  }
  Object.entries(MODES).forEach(([key,m])=>{const p=completeCombo(chosenColors(),key),btn=document.createElement('button');btn.className='idea';btn.innerHTML=`<div class="idea-top"><i style="background:${p.base}"></i><i style="background:${p.structure}"></i><i style="background:${p.accent}"></i></div><div class="idea-name">${m.label}</div><div class="idea-meta">${p.base} · ${p.structure} · ${p.accent}</div>`;btn.onclick=()=>{mode=key;palette=p;renderModes();render();$('#result').scrollIntoView({behavior:'smooth',block:'start'})};box.appendChild(btn)})}
function renderModes(){const el=$('#modes');el.innerHTML='';Object.entries(MODES).forEach(([k,m])=>{const b=document.createElement('button');b.className='chip'+(k===mode?' active':'');b.textContent=m.label;b.onclick=()=>{mode=k;renderModes();generate(false)};el.appendChild(b)})}
function save(){
  const inputName=($('#comboName')?.value||'').trim();
  currentComboName=inputName||'未命名配色';
  const data=JSON.parse(localStorage.getItem('colorlab.saved')||'[]');
  data.unshift({name:currentComboName,seed,selectedColors:[...selectedColors],mode,palette:{...palette},date:Date.now()});
  localStorage.setItem('colorlab.saved',JSON.stringify(data.slice(0,30)));
  renderSaved();
  toast('已收藏 '+currentComboName);
}
function renderSaved(){
  const el=$('#saved'),data=JSON.parse(localStorage.getItem('colorlab.saved')||'[]');
  if(!data.length){el.innerHTML='<div class="saved-empty">還沒有收藏。先找到一組你真的想再用的顏色。</div>';return}
  el.innerHTML='<div class="saved-list"></div>';
  const list=el.firstChild;
  data.forEach((x,i)=>{
    const d=document.createElement('div');d.className='saved-item';
    const title=(x.name&&x.name.trim())||'未命名配色';
    d.innerHTML=`<div class="mini3"><i style="background:${x.palette.base}"></i><i style="background:${x.palette.structure}"></i><i style="background:${x.palette.accent}"></i></div><div class="saved-info"><b>${title}</b><div class="idea-meta">${x.seed}</div></div><div class="saved-actions"><button class="saved-rename" data-rename="${i}">改名</button><button class="saved-copy" data-load="${i}">套用</button></div>`;
    list.appendChild(d);
  })
}
function renameSaved(index){
  const data=JSON.parse(localStorage.getItem('colorlab.saved')||'[]');
  const item=data[index]; if(!item)return;
  const oldName=(item.name&&item.name.trim())||'未命名配色';
  const next=prompt('配色名稱',oldName);
  if(next===null)return;
  item.name=next.trim()||'未命名配色';
  localStorage.setItem('colorlab.saved',JSON.stringify(data));
  renderSaved();
  toast('已改名');
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1200)}
function copy(v){navigator.clipboard?.writeText(v).then(()=>toast('已複製 '+v)).catch(()=>{})}

const photoInput=$('#photoInput'),photoCanvas=$('#photoCanvas'),photoPanel=$('#photoPanel'),pickMarker=$('#pickMarker');
const photoCtx=photoCanvas.getContext('2d',{willReadFrequently:true,colorSpace:'srgb'});
const magnifier=$('#magnifier'),magnifierCanvas=$('#magnifierCanvas'),magnifierCtx=magnifierCanvas.getContext('2d',{willReadFrequently:true,colorSpace:'srgb'}),pickReadout=$('#pickReadout');
let photoObjectURL=null,photoPicking=false,lastPicked=null;

function openPhotoPicker(){photoInput.click()}
function loadPhoto(file){
  if(!file||!file.type.startsWith('image/'))return;
  if(photoObjectURL)URL.revokeObjectURL(photoObjectURL);
  photoObjectURL=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    const maxSide=2200;
    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    photoCanvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    photoCanvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    photoCtx.clearRect(0,0,photoCanvas.width,photoCanvas.height);
    photoCtx.imageSmoothingEnabled=true;
    photoCtx.drawImage(img,0,0,photoCanvas.width,photoCanvas.height);
    photoPanel.classList.add('show');
    pickMarker.style.display='none';
    magnifier.style.display='none';
    URL.revokeObjectURL(photoObjectURL);photoObjectURL=null;
    toast('按住照片拖動取色');
  };
  img.onerror=()=>toast('照片讀取失敗');
  img.src=photoObjectURL;
}
function mapPhotoPoint(clientX,clientY){
  const r=photoCanvas.getBoundingClientRect();
  const frameR=$('#photoFrame').getBoundingClientRect();
  const localX=clamp(clientX-r.left,0,r.width-0.001);
  const localY=clamp(clientY-r.top,0,r.height-0.001);
  const px=Math.min(photoCanvas.width-1,Math.max(0,Math.floor(localX*photoCanvas.width/r.width)));
  const py=Math.min(photoCanvas.height-1,Math.max(0,Math.floor(localY*photoCanvas.height/r.height)));
  return {r,frameR,localX,localY,px,py};
}
function exactPixel(px,py){
  const d=photoCtx.getImageData(px,py,1,1).data;
  return rgbToHex(d[0]/255,d[1]/255,d[2]/255);
}
function drawMagnifier(px,py,picked,clientX,clientY,frameR){
  const sample=11, zoom=112/sample;
  const sx=Math.max(0,Math.min(photoCanvas.width-sample,px-Math.floor(sample/2)));
  const sy=Math.max(0,Math.min(photoCanvas.height-sample,py-Math.floor(sample/2)));
  magnifierCtx.imageSmoothingEnabled=false;
  magnifierCtx.clearRect(0,0,112,112);
  magnifierCtx.drawImage(photoCanvas,sx,sy,sample,sample,0,0,112,112);

  const localPointerX=clientX-frameR.left;
  const localPointerY=clientY-frameR.top;
  const size=112;
  let left=localPointerX-size/2;
  let top=localPointerY-size-38;
  if(top<8) top=localPointerY+38;
  left=Math.max(8,Math.min(frameR.width-size-8,left));
  top=Math.max(8,Math.min(frameR.height-size-8,top));
  magnifier.style.left=left+'px';
  magnifier.style.top=top+'px';
  magnifier.style.display='block';
  pickReadout.textContent=picked;
}
function updatePhotoPick(clientX,clientY,commit=false){
  if(!photoCanvas.width||!photoCanvas.height)return;
  const p=mapPhotoPoint(clientX,clientY);
  const picked=exactPixel(p.px,p.py);
  lastPicked=picked;

  pickMarker.style.left=((p.r.left-p.frameR.left)+p.localX)+'px';
  pickMarker.style.top=((p.r.top-p.frameR.top)+p.localY)+'px';
  pickMarker.style.setProperty('--picked',picked);
  pickMarker.style.display='block';

  drawMagnifier(p.px,p.py,picked,clientX,clientY,p.frameR);

  if(commit){
    setColorAtActive(picked);
    toast('已取色 '+picked);
  }
}
$('#photoTrigger').onclick=openPhotoPicker;
$('#photoChange').onclick=openPhotoPicker;
photoInput.addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(file)loadPhoto(file);e.target.value=''});

photoCanvas.addEventListener('pointerdown',e=>{
  photoPicking=true;
  try{photoCanvas.setPointerCapture(e.pointerId)}catch(_){}
  updatePhotoPick(e.clientX,e.clientY,false);
});
photoCanvas.addEventListener('pointermove',e=>{
  if(!photoPicking)return;
  e.preventDefault();
  updatePhotoPick(e.clientX,e.clientY,false);
});
function finishPhotoPick(e){
  if(!photoPicking)return;
  photoPicking=false;
  updatePhotoPick(e.clientX,e.clientY,true);
  setTimeout(()=>magnifier.style.display='none',120);
  try{photoCanvas.releasePointerCapture(e.pointerId)}catch(_){}
}
photoCanvas.addEventListener('pointerup',finishPhotoPick);
photoCanvas.addEventListener('pointercancel',()=>{
  photoPicking=false;
  magnifier.style.display='none';
});

$('#color').addEventListener('input',e=>{setColorAtActive(e.target.value.toUpperCase())});
$('#hex').addEventListener('change',e=>{const h=normHex(e.target.value);if(h)setColorAtActive(h);else e.target.value=selectedColors[activeSlot]||seed});
$('#generate').onclick=()=>generate(true);
$('#save').onclick=save;
document.addEventListener('click',e=>{
  const rm=e.target.closest('[data-remove-slot]');if(rm){e.stopPropagation();removeSlot(+rm.dataset.removeSlot);return}
  const sl=e.target.closest('[data-slot]');if(sl){setActiveSlot(+sl.dataset.slot,!selectedColors[+sl.dataset.slot]);return}
  const c=e.target.closest('[data-copy]');if(c)copy(c.dataset.copy);
  const s=e.target.closest('[data-shuffle]');if(s)shuffle(s.dataset.shuffle);
  const rn=e.target.closest('[data-rename]');if(rn){renameSaved(+rn.dataset.rename);return}
  const l=e.target.closest('[data-load]');if(l){const data=JSON.parse(localStorage.getItem('colorlab.saved')||'[]'),x=data[+l.dataset.load];if(x){seed=x.seed;mode=x.mode;palette={...x.palette};selectedColors=x.selectedColors?[...x.selectedColors]:[x.seed,null,null];while(selectedColors.length<3)selectedColors.push(null);activeSlot=Math.max(0,selectedColors.findIndex(Boolean));currentComboName=(x.name&&x.name.trim())||'未命名配色';$('#comboName').value=currentComboName==='未命名配色'?'':currentComboName;syncEditor();renderModes();render();$('#result').scrollIntoView({behavior:'smooth',block:'start'})}}
});
renderModes();renderComboSlots();generate(false);$('#comboName').value='';
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
